name: anonh4x
description: AnonH4X - Game Network Monitor
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

  dependencies:
    flutter:
        sdk: flutter
          dart_ping: ^9.0.0
            network_info_plus: ^5.0.0
              connectivity_plus: ^6.0.0
                fl_chart: ^0.68.0
                  flutter_overlay_window: ^0.3.0
                    sqflite: ^2.3.0
                      path: ^1.9.0
                        path_provider: ^2.1.0
                          provider: ^6.1.0
                            flutter_svg: ^2.0.0
                              permission_handler: ^11.0.0

                              dev_dependencies:
                                flutter_test:
                                    sdk: flutter
                                      flutter_lints: ^3.0.0

                                      flutter:
                                        uses-material-design: true
                                          assets:
                                              - assets/servers.json